
services:
  mysql:
    build: mysql
    container_name: mysql-camagru-database
    volumes:
      - db_volume:/var/lib/mysql/
    # ports:
    #   - "3336:3306"
    env_file:
      - .env
    networks:
      - camagru
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 10
  nginx:
    build: nginx
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "4243:443"
    networks:
      - camagru
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - nginx:/usr/share/nginx/
      - php_code:/var/www/php
      - pictures:/var/www/pictures
  php:
    build: ./php
    expose:
      - 9000
    networks:
      - camagru
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - php_code:/var/www/php
      - pictures:/var/www/pictures

volumes:
  nginx:
    name: nginx-volumes
    driver: local
    driver_opts:
      type: none
      device: ./front
      o: bind
  pictures:
    name: pictures-volumes
    driver: local
    driver_opts:
      type: none
      device: ./images
      o: bind
  php_code:
    name: php-volumes
    driver: local
    driver_opts:
      type: none
      device: ./php/code
      o: bind
  db_volume:
    driver: local
    name: db_volume
    # external: true
      
  
networks:
  camagru:
    name: camagru
    driver: bridge